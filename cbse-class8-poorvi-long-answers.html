{type:'Diary Entry',marks:'5 marks · 100 words',q:'Write a diary entry describing your first day in Class 8. Mention your feelings and what you plan to do this year.',a:'Monday, 7 April 2026<br>9:30 p.m.<br><br>Dear Diary,<br><br>Today was my first day in Class 8. I woke up early and felt both excited and a little nervous. When I entered the new classroom, I saw some old friends and a few new faces. Our class teacher welcomed us warmly and told us about the subjects we will study this year. I have decided to study regularly, take part in sports and help my classmates whenever I can. I hope Class 8 will be a year of good learning and happy memories.<br><br>Good night!<br>Aarav'},
{type:'Informal Letter',marks:'5 marks · 120 words',q:'Write a letter to your friend inviting him/her to spend a few days with you during the winter vacation.',a:'12, Park Street<br>New Delhi<br>10 October 2026<br><br>Dear Rohan,<br><br>I hope this letter finds you in good health and spirits. Our winter vacation is going to start next month. I would be very happy if you could come and stay with us for four or five days. We can play cricket in the park, watch movies and visit the India Gate in the evening. My parents are also looking forward to meeting you. Please ask your parents and let me know the dates that suit you. I am waiting eagerly for your reply.<br><br>Yours lovingly,<br>Amit'},
{type:'Formal Letter',marks:'5 marks · 120 words',q:'Write a letter to the Principal of your school requesting permission to organise a cleanliness drive in the school premises.',a:'The Principal<br>City Public School<br>New Delhi<br><br>10 October 2026<br><br>Subject: Request for permission to organise a cleanliness drive<br><br>Respected Sir/Madam,<br><br>I am a student of Class VIII-A and a member of the Eco Club. On behalf of the club, I request your kind permission to organise a cleanliness drive in the school premises on 28 October 2026. Students will clean the classrooms, corridors and the playground. We will also put up posters on cleanliness. The activity will be held after school hours under the guidance of our Eco Club teacher.<br><br>I shall be grateful if you grant us permission.<br><br>Yours obediently,<br>Meera Nair<br>Class VIII-A'},
{type:'Story Writing',marks:'5 marks · 150 words',q:'Write a short story based on the outline: A poor woodcutter – axe falls into river – fairy appears – offers golden and silver axes – woodcutter refuses – gets all three. Give a suitable title and moral.',a:'The Honest Woodcutter<br><br>Once there lived a poor but honest woodcutter near a river. One day, while he was cutting wood, his iron axe slipped from his hand and fell into the deep river. He sat on the bank and began to cry. Suddenly a fairy appeared and asked him why he was sad. When he told her about the axe, she dived into the river and brought out a golden axe. The woodcutter said it was not his. She then brought a silver axe, but he refused that too. Finally she brought his own iron axe. The woodcutter was overjoyed. The fairy was pleased with his honesty and gave him all three axes as a reward.<br><br>Moral: Honesty is the best policy.'},
{type:'Article',marks:'5 marks · 120 words',q:'Write a short article on “The Importance of Reading Books” for your school magazine.',a:'The Importance of Reading Books<br><br>Reading books is one of the best habits a student can develop. Books give us knowledge, improve our language and take us to new worlds of imagination. When we read regularly, our vocabulary grows and we learn to express our thoughts clearly. Story books teach us values, while informative books increase our general knowledge. In today’s world of mobile phones and short videos, many children are forgetting the joy of reading. Schools and parents should encourage children to read at least twenty to thirty minutes every day. A good book is a friend that never leaves us. Therefore, every student should make reading a daily habit.'},
{type:'Paragraph',marks:'4 marks · 100 words',q:'Write a paragraph on “My Favourite Season”.',a:'My favourite season is winter. The weather becomes cool and pleasant after the hot summer months. We can enjoy hot soups, wear warm sweaters and go for morning walks without feeling tired. Many festivals such as Diwali and Christmas are celebrated in winter, which makes the season even more special. Schools often organise picnics and sports events during this time. I love sitting in the sun with my family and listening to stories. Winter also brings a sense of calm and togetherness. That is why I wait for winter every year.'},
{type:'Message',marks:'3 marks · 40 words',q:'You receive a phone call for your father who is not at home. The caller says there is a parent-teacher meeting tomorrow. Write a message for your father.',a:'15 October, 5:30 p.m.<br><br>Dad,<br>Mr. Sharma from school called. There is a parent-teacher meeting tomorrow at 10 a.m. in the school hall. Please try to attend.<br><br>Aman'},
{type:'Poster',marks:'4 marks',q:'Design a poster highlighting the importance of planting trees. Include a slogan and three key points.',a:'PLANT TREES, SAVE EARTH<br><br>Trees give us oxygen, shade and fruits<br><br>• Plant at least one sapling this month<br>• Water it regularly and protect it<br>• Say no to cutting trees<br><br>Join the Green Drive!<br>Eco Club, City School'}
];

{type:'Notice',marks:'4 marks · 50 words',q:'The school is organising a Book Fair. Write a notice inviting students and parents.',a:'MODERN PUBLIC SCHOOL<br>NOTICE<br>Annual Book Fair<br><br>16 October 2026<br><br>The school is organising a Book Fair from 5 to 7 November 2026 in the school hall from 9 a.m. to 4 p.m. A wide range of story books, comics and reference books will be available at special prices. All students and parents are invited.<br><br>Librarian'},
{type:'Notice',marks:'4 marks · 50 words',q:'Write a notice about an upcoming debate competition.',a:'RIVERDALE SCHOOL<br>NOTICE<br>Inter-House Debate Competition<br><br>18 October 2026<br><br>An Inter-House Debate Competition on the topic “Online Classes are Better than Classroom Teaching” will be held on 2 November 2026 at 10 a.m. in the auditorium. Students who wish to participate may give their names to the English teacher by 25 October.<br><br>Cultural Secretary'},
{type:'Diary Entry',marks:'5 marks · 100 words',q:'Write a diary entry about a day when you helped someone in need.',a:'Thursday, 16 October 2026<br><br>Dear Diary,<br><br>Today I saw an elderly woman struggling to carry heavy bags near the market. I offered to help her and carried the bags to her house, which was only two lanes away. She thanked me with a smile and blessed me. I felt very happy. Helping someone, even in a small way, made my day special. I have decided to look for more opportunities to help people around me.<br><br>Good night!<br>Riya'},
{type:'Formal Letter',marks:'5 marks · 120 words',q:'Write a letter to the Principal requesting repair of broken classroom furniture.',a:'The Principal<br>Sunshine Public School<br>New Delhi<br><br>Subject: Request for repair of classroom furniture<br><br>Respected Sir/Madam,<br><br>I am a student of Class VIII-B. I wish to bring to your notice that several desks and chairs in our classroom are broken. Some students find it difficult to sit comfortably during lessons. I request you to kindly arrange for the repair or replacement of the damaged furniture at the earliest so that we can study properly.<br><br>Yours obediently,<br>Kabir Sharma<br>Class VIII-B'},
{type:'Story Writing',marks:'5 marks · 140 words',q:'Write a story with the moral “Kindness is rewarded”.',a:'The Kind Traveller<br><br>A tired traveller was walking through a forest on a hot day. He saw a dog lying under a tree, panting with thirst. The traveller had only a little water left, but he poured some into his cupped hands and let the dog drink. The dog looked at him gratefully. Later, when the traveller lost his way and night began to fall, the same dog appeared and led him safely back to the main path. The traveller realised that his small act of kindness had been returned to him.<br><br>Moral: Kindness is rewarded.'},
{type:'Article',marks:'5 marks · 120 words',q:'Write an article on “Healthy Eating Habits for Students”.',a:'Healthy Eating Habits for Students<br><br>Good food is necessary for a healthy body and a sharp mind. Students should eat a balanced diet that includes fruits, vegetables, milk, eggs and whole grains. Junk food such as chips and sugary drinks should be avoided because they provide empty calories and can make us feel lazy. Drinking plenty of water and eating meals on time also help. Parents and schools can encourage healthy eating by providing nutritious tiffin and teaching children about the benefits of good food. Healthy eating habits formed in school last a lifetime.'},
{type:'Paragraph',marks:'4 marks · 90 words',q:'Write a paragraph on “A Visit to the Zoo”.',a:'Last Sunday I visited the city zoo with my family. We saw lions, tigers, elephants and many colourful birds. The monkeys were jumping and playing, which made everyone laugh. I also saw a large aquarium with different kinds of fish. The zoo was clean and well maintained. I learned many new facts about animals from the information boards. It was an enjoyable and educational trip. I hope to visit the zoo again soon.'},
{type:'Message',marks:'3 marks · 35 words',q:'Write a message for your sister telling her that her friend called and will meet her at the park at 5 p.m.',a:'14 October, 3:00 p.m.<br><br>Diya,<br>Your friend Anjali called. She will meet you at the park at 5 p.m. today. Don’t forget.<br><br>Mom'},
{type:'Poster',marks:'4 marks',q:'Design a poster on “Say No to Plastic Bags”.',a:'SAY NO TO PLASTIC<br><br>Plastic bags harm animals and pollute our earth<br><br>• Carry a cloth bag<br>• Refuse single-use plastic<br>• Recycle what you can<br><br>Be the Change!<br>Environment Club, Class 8'},
{type:'Informal Letter',marks:'5 marks · 110 words',q:'Write a letter to your cousin describing your school’s Annual Sports Day.',a:'22, Lake Road<br>Jaipur<br>12 October 2026<br><br>Dear Vikram,<br><br>I hope you are fine. Our school celebrated its Annual Sports Day last Friday. I took part in the 100-metre race and the long jump. Our house won the march-past trophy. The chief guest distributed prizes and praised the students. There were races, relays and fun games for juniors. Everyone enjoyed the day. I wish you had been here to cheer for me. Write back soon and tell me about your school events.<br><br>Yours lovingly,<br>Aarav'},
{type:'Notice',marks:'4 marks · 50 words',q:'Write a notice informing students about a tree-plantation drive.',a:'GREEN EARTH SCHOOL<br>NOTICE<br>Tree Plantation Drive<br><br>20 October 2026<br><br>The Eco Club is organising a Tree Plantation Drive on 5 November 2026 at 8 a.m. in the school garden. Students who wish to participate may give their names to the Eco Club in-charge by 28 October.<br><br>Eco Club Secretary'},
{type:'Diary Entry',marks:'5 marks · 100 words',q:'Write a diary entry about a rainy evening you spent at home.',a:'Saturday, 11 October 2026<br><br>Dear Diary,<br><br>It rained heavily this evening. I sat near the window and watched the raindrops falling on the leaves. The sound of rain was very peaceful. I finished my English homework and then read two chapters of a story book. Mom made hot pakoras, which we enjoyed with tea. Rainy evenings at home feel special. I hope it rains again soon.<br><br>Good night!<br>Sneha'},
{type:'Formal Letter',marks:'5 marks · 110 words',q:'Write a letter to the editor of a local newspaper about the need for a public library in your area.',a:'The Editor<br>The City Times<br>New Delhi<br><br>Subject: Need for a public library in our area<br><br>Sir,<br><br>Through the columns of your newspaper I wish to draw attention to the need for a public library in our locality. Many students and adults want to read books but there is no library nearby. A small public library would help children develop the reading habit and give adults a quiet place to read. I request the authorities to consider this suggestion.<br><br>Yours faithfully,<br>Rahul Verma<br>Class VIII'},
{type:'Story Writing',marks:'5 marks · 130 words',q:'Complete the story: It was a dark night. Rahul was returning home when he saw…',a:'The Helpful Stranger<br><br>It was a dark night. Rahul was returning home from his friend’s house when he saw an old man sitting by the roadside. The man looked tired and lost. Rahul stopped and asked if he needed help. The old man said he could not find his way to his son’s house. Rahul used his father’s phone to call the number the man gave him. Soon the man’s son arrived and thanked Rahul warmly. Rahul felt happy that he had stopped to help. He reached home safely and told his parents about the incident.<br><br>Moral: Helping others brings joy.'},
{type:'Article',marks:'5 marks · 120 words',q:'Write an article on “The Value of Time” for your school magazine.',a:'The Value of Time<br><br>Time is the most precious thing we have. Once a moment is gone, it never comes back. Students who use their time wisely finish their homework, revise regularly and still find time for games and hobbies. Those who waste time on unnecessary activities often feel stressed before examinations. Making a simple daily timetable can help us balance study, play and rest. We should also learn to say no to distractions. Remember, time and tide wait for none. Let us value every hour and use it for useful work and healthy fun.'},
{type:'Paragraph',marks:'4 marks · 90 words',q:'Write a paragraph on “My Best Friend”.',a:'My best friend is Aarav. We have been studying in the same class since Class 5. He is honest, helpful and always ready to share his notes. We play cricket together in the evening and help each other with difficult subjects. Aarav never laughs at my mistakes; instead he explains things patiently. I can share my problems with him and he keeps them secret. A true friend like Aarav makes school life happy and meaningful.'},
{type:'Dialogue',marks:'4 marks',q:'Write a dialogue between two friends discussing their plans for the weekend.',a:'Riya: What are you doing this weekend?<br>Aman: I am going to visit my grandparents. What about you?<br>Riya: I will finish my project and then watch a movie with my family.<br>Aman: That sounds nice. Let’s meet on Monday and share what we did.<br>Riya: Sure! Have a good weekend.<br>Aman: You too!'},
{type:'Dialogue',marks:'4 marks',q:'Write a dialogue between a student and the librarian about issuing a book.',a:'Student: Ma’am, may I issue this story book?<br>Librarian: Yes, you may. Do you have your library card?<br>Student: Yes, here it is.<br>Librarian: You can keep the book for seven days. Please return it on time.<br>Student: Thank you, ma’am. I will return it next week.'},
{type:'Poster',marks:'4 marks',q:'Design a poster on “Save Water”.',a:'SAVE WATER<br>SAVE LIFE<br><br>Every drop counts<br><br>• Turn off taps properly<br>• Fix leaking pipes<br>• Use a bucket instead of a shower<br><br>Water is precious – Don’t waste it!<br>Eco Club'},

const sel=new Set();let cur='home';
const $=id=>document.getElementById(id);

function lookup(id){const [k,a,b]=id.split('-');if(k==='L'){const q=(LIT[a]||[])[b];return {q:q[0],a:q[1],src:CH[a][1]};}if(k==='W'){const w=WR[a];return {q:w.q,a:w.a,src:w.type};}return {q:'',a:'',src:''};}
function toggle(id){sel.has(id)?sel.delete(id):sel.add(id);count();document.querySelectorAll(`[data-id="${id}"]`).forEach(b=>b.innerHTML=sel.has(id)?'Added':'Add');if(cur==='builder')render();}
function count(){$('badgeH').textContent=sel.size;}
function addBtn(id){return `<button data-id="${id}" onclick="toggle('${id}')" class="noprint text-xs rounded-full border border-emerald-300 text-emerald-700 px-3 py-1">${sel.has(id)?'Added':'Add to test'}</button>`;}
function qaBlock(id,n){const x=lookup(id);return `<article><div class="flex justify-between gap-2"><h3 class="font-semibold"><span class="text-emerald-600">Q${n}.</span> ${x.q}</h3>${addBtn(id)}</div><p class="ans mt-2 rounded-r-lg p-3 text-sm leading-relaxed">${x.a}</p></article>`;}
function openDrawer(t,s,h){$('dTitle').textContent=t;$('dSub').textContent=s;$('dBody').innerHTML=h;$('overlay').classList.remove('hidden');$('drawer').classList.remove('translate-x-full');}
function closeDrawer(){$('overlay').classList.add('hidden');$('drawer').classList.add('translate-x-full');}
function openCh(i){const qs=LIT[i]||[];openDrawer(CH[i][1],SECT[CH[i][0]][1]+' · '+qs.length+' questions',qs.map((_,n)=>qaBlock('L-'+i+'-'+n,n+1)).join(''));}
function chapterList(sec){const cols={u1:'#059669',u2:'#e11d48',u3:'#7c3aed',u4:'#0d9488',u5:'#0284c7'};return '<div class="grid sm:grid-cols-2 gap-4 mt-4">'+CH.map((c,i)=>c[0]!==sec?'':`<button onclick="openCh(${i})" class="card text-left rounded-2xl bg-white p-5 shadow-sm border-t-4" style="border-color:${cols[sec]}"><span class="serif text-lg font-bold">${c[1]}</span><div class="text-sm text-slate-500 mt-2">${(LIT[i]||[]).length} long answers</div></button>`).join('')+'</div>';}
function showW(i){const e=document.getElementById('wa'+i);e.classList.toggle('hidden');document.getElementById('wb'+i).textContent=e.classList.contains('hidden')?'Show model answer':'Hide';}
const V={

  <button onclick="go('unit4')" class="card text-left rounded-2xl bg-white p-5 shadow-sm border-l-4 border-teal-500 hover:shadow-md"><div class="flex items-center gap-3 mb-2"><span class="h-10 w-10 rounded-xl bg-teal-100 text-teal-700 flex items-center justify-center"><i class="fa-solid fa-leaf"></i></span><span class="font-bold">Unit 4</span></div><div class="text-sm text-slate-600">Environment<br>3 chapters · 60 answers</div></button>

unit1:()=>'<h1 class="text-3xl font-bold">Unit 1: Wit and Wisdom</h1>'+chapterList('u1'),
unit2:()=>'<h1 class="text-3xl font-bold">Unit 2: Values and Dispositions</h1>'+chapterList('u2'),
unit3:()=>'<h1 class="text-3xl font-bold">Unit 3: Mystery and Magic</h1>'+chapterList('u3'),
unit4:()=>'<h1 class="text-3xl font-bold">Unit 4: Environment</h1>'+chapterList('u4'),
unit5:()=>'<h1 class="text-3xl font-bold">Unit 5: Science and Curiosity</h1>'+chapterList('u5'),
writing:()=>`<h1 class="text-3xl font-bold">Writing Skills</h1><p class="text-sm mb-4">${WR.length} tasks with full model answers</p><div class="space-y-4">`+WR.map((w,i)=>`<article class="rounded-2xl bg-white border p-5"><div class="flex justify-between"><span class="rounded-full bg-emerald-700 text-white text-xs px-3 py-1">${w.type}</span>${addBtn('W-'+i)}</div><p class="mt-2 font-medium">${w.q}</p><button id="wb${i}" onclick="showW(${i})" class="mt-2 rounded-full bg-emerald-600 text-white text-sm px-4 py-1">Show model answer</button><div id="wa${i}" class="hidden ans mt-2 p-3 text-sm leading-relaxed">${w.a}</div></article>`).join('')+'</div>',
builder:()=>{const ids=[...sel];return `<h1 class="text-3xl font-bold">Test Builder</h1><button onclick="window.print()" class="rounded-full bg-emerald-700 text-white px-4 py-1 text-sm">Print</button>`+(ids.length?ids.map((id,n)=>{const x=lookup(id);return `<div class="mt-3 p-3 border rounded"><b>${n+1}.</b> ${x.q}<p class="ans mt-1 p-2 text-sm">${x.a}</p></div>`}).join(''):'<p>No items selected</p>')}
};
function render(){$('view').innerHTML=V[cur]();document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.v===cur));}
function go(v){cur=v;closeDrawer();render();}
function init(){$('side').innerHTML=NAV.map(n=>`<button data-v="${n[0]}" onclick="go('${n[0]}')" class="navbtn w-full text-left rounded-lg px-3 py-2 text-sm hover:bg-emerald-50 flex gap-2"><i class="fa-solid ${n[2]}"></i>${n[1]}</button>`).join('');$('mobnav').innerHTML=NAV.map(n=>`<button data-v="${n[0]}" onclick="go('${n[0]}')" class="navbtn px-3 py-2"><i class="fa-solid ${n[2]}"></i></button>`).join('');render();count();}
init();
